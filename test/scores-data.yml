# Fixtures for the leaderboard page tests (app/views/openttd/Scores/show.html), loaded by
# ScoresPageTest after test/data.yml.
#
# Twelve players, deliberately without any PlayedGameScore: the empty list path of the
# template is the default state, and each test seeds only the scores it asserts. Their ids
# follow test/data.yml's four users (admin=1, modo=2, bob=3, anonymous=4), so they are 5..16
# in the order below, which makes getPlayerScores()' "order by 1 desc, 3 desc, 2 asc"
# tie-break (user id ascending) assertable.
#
# nbScores is PlayedGameScore.count(from, to), i.e. the number of DISTINCT players in the
# period, not the number of score rows: a player with two score rows counts once there and
# twice in the Games column.
#
# Like index-data.yml, this file is rendered as a Play template before being parsed as YAML,
# so it must not contain any play tag or dollar expression.

