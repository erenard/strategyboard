# Test data
#
# Entity ids are assigned in the order the entries appear below, and the tests
# address entities by id (e.g. /forums/1, /forums/1/topics/1). Keep the ordering.
#
# mainCategory must be the SECOND Category: Profile.Security.check() falls back to
# Category.findById(2) when the route has no forumId (see the TODO in that method).

models.forum.UserGroup(admin):
  name:        Admin
  description: Admin
  admin:       true

models.forum.UserGroup(moderators):
  name:        Moderators
  description: Moderators
  admin:       false

models.forum.UserGroup(users):
  name:        General
  description: General
  admin:       false

models.forum.UserGroup(anonymous):
  name:        Anonymous
  description: Anonymous
  admin:       false

models.forum.Category(moderatorsCategory):
  name:        Moderators Category
  description: Moderators Category

models.forum.Category(mainCategory):
  name:        Main Category
  description: Main Category

models.forum.Permission(postMain):
  category:    "mainCategory"
  group:       "users"
  accessLevel: 3

models.forum.Permission(moderateMain):
  category:    "mainCategory"
  group:       "moderators"
  accessLevel: 4

models.forum.Permission(postModerators):
  category:    "moderatorsCategory"
  group:       "moderators"
  accessLevel: 3

models.forum.Permission(viewModerators):
  category:    "moderatorsCategory"
  group:       "users"
  accessLevel: 1

models.forum.Permission(viewAnonymous):
  category:    "mainCategory"
  group:       "anonymous"
  accessLevel: 1

